<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة وحصر الحقائب التدريبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B132B;
            --bg-card: #1C2541;
            --accent-blue: #00B4D8;
            --accent-green: #06D6A0;
            --text-light: #F4F5F7;
            --text-muted: #A5A5A5;
            --border-color: #3A506B;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-light); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        header h1 { color: var(--accent-blue); font-size: 28px; }
        
        /* شريط التنقّل */
        nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        nav button { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        nav button:hover, nav button.active { background-color: var(--accent-blue); color: var(--bg-main); font-weight: bold; border-color: var(--accent-blue); }
        
        .tab-content { display: none; background-color: var(--bg-card); border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); }
        .tab-content.active { display: block; }
        
        /* النماذج والجداول */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--accent-blue); }
        input, textarea, select { width: 100%; padding: 12px; background-color: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 6px; font-size: 16px; }
        textarea { height: 120px; resize: vertical; }
        
        button.btn-submit { background-color: var(--accent-green); color: var(--bg-main); padding: 12px 25px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        button.btn-submit:hover { opacity: 0.9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--border-color); color: var(--accent-blue); font-weight: bold; }
        tr:hover { background-color: rgba(255,255,255,0.02); }
        
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; display: inline-block; }
        .status-success { background-color: rgba(6, 214, 160, 0.2); color: var(--accent-green); }
        
        /* تنبيهات الحالة */
        #statusMessage { padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>لوحة تحكم وبوابة المادة التدريبية الذكية</h1>
    </header>

    <nav>
        <button onclick="switchTab('settings')" id="tab-settings" class="active">⚙️ الإعدادات والربط</button>
        <button onclick="switchTab('material')" id="tab-material">📝 تفاصيل الحقيبة والمادة التدريبية</button>
    </nav>

    <div id="content-settings" class="tab-content active">
        <h2>⚙️ روابط تهيئة الاتصال والمزامنة والمستخدمين</h2>
        <div class="form-group" style="margin-top: 15px;">
            <label>1. رابط جوجل شيت المباشر (CSV Link):</label>
            <input type="text" id="csvUrlInput" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
        </div>
        <div class="form-group">
            <label>2. رابط بوابة التعديل البرمجية الذكية (Google Apps Script Web App URL):</label>
            <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="form-group">
            <label>3. اسم المستخدم الحالي المعتمد لإجراء التعديلات:</label>
            <input type="text" id="usernameInput" value="المشرف المسؤول">
        </div>
        <button class="btn-submit" onclick="saveSettings()">💾 حفظ إعدادات التهيئة والربط</button>
        <div id="statusMessage"></div>
    </div>

    <div id="content-material" class="tab-content">
        <h2>📝 إضافة وتحديث تفاصيل المادة التدريبية اليومية</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
            <div class="form-group">
                <label>اليوم التدريبي (رقم اليوم):</label>
                <select id="matDayNumber" onchange="loadSpecificDayMaterial()">
                    <option value="1">اليوم الأول</option>
                    <option value="2">اليوم الثاني</option>
                    <option value="3">اليوم الثالث</option>
                    <option value="4">اليوم الرابع</option>
                    <option value="5">اليوم الخامس</option>
                    <option value="6">اليوم السادس</option>
                    <option value="7">اليوم السابع</option>
                    <option value="8">اليوم الثامن</option>
                    <option value="9">اليوم التاسع</option>
                    <option value="10">اليوم العاشر</option>
                </select>
            </div>
            <div class="form-group">
                <label>التاريخ المعتمد لهذا اليوم:</label>
                <input type="date" id="matDate">
            </div>
        </div>
        <div class="form-group">
            <label>محتوى وتفاصيل الحقيبة المضافة:</label>
            <textarea id="matContent" placeholder="اكتب هنا محاور التدريب، العناوين الرئيسية، الأنشطة، والمستهدفات الخاصة بهذا اليوم..."></textarea>
        </div>
        <button class="btn-submit" onclick="submitMaterialForm()">📤 حفظ وتحديث تفاصيل اليوم التدريبي</button>

        <h3 style="margin-top: 35px; color: var(--accent-blue);">📋 السجل التاريخي للحقائب والمواد المدخلة</h3>
        <table id="materialTable">
            <thead>
                <tr>
                    <th>اليوم</th>
                    <th>التاريخ</th>
                    <th>محتوى وتفاصيل الحقيبة المضافة</th>
                    <th>بواسطة</th>
                    <th>وقت الإجراء</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted);">يرجى حفظ الروابط أولاً لجلب السجل المحدث...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // التنقل بين الأقسام
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        
        document.getElementById('content-' + tabId).classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        
        if (tabId === 'material') {
            loadSpecificDayMaterial();
            loadMaterialTable();
        }
    }

    // حفظ واسترجاع الإعدادات من ذاكرة المتصفح المحلية
    function saveSettings() {
        localStorage.setItem('csvUrl', document.getElementById('csvUrlInput').value.trim());
        localStorage.setItem('scriptUrl', document.getElementById('scriptUrlInput').value.trim());
        localStorage.setItem('savedUsername', document.getElementById('usernameInput').value.trim());
        
        showNotification('✅ تم حفظ إعدادات الاتصال والمزامنة بنجاح!', 'var(--accent-green)');
    }

    window.onload = function() {
        if(localStorage.getItem('csvUrl')) document.getElementById('csvUrlInput').value = localStorage.getItem('csvUrl');
        if(localStorage.getItem('scriptUrl')) document.getElementById('scriptUrlInput').value = localStorage.getItem('scriptUrl');
        if(localStorage.getItem('savedUsername')) document.getElementById('usernameInput').value = localStorage.getItem('savedUsername');
    }

    function showNotification(text, color) {
        const msg = document.getElementById('statusMessage');
        msg.style.display = 'block';
        msg.style.backgroundColor = color;
        msg.style.color = '#0B132B';
        msg.innerText = text;
        setTimeout(() => { msg.style.display = 'none'; }, 4000);
    }

    // جلب بيانات يوم محدد تلقائياً عند تغييره من القائمة
    function loadSpecificDayMaterial() {
        const scriptUrl = localStorage.getItem('scriptUrl');
        if (!scriptUrl) return;
        
        const day = document.getElementById('matDayNumber').value;
        
        fetch(`${scriptUrl}?action=getMaterial&dayNumber=${day}`, { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(data => {
            if (data) {
                document.getElementById('matContent').value = data.content || '';
                document.getElementById('matDate').value = data.materialDate || '';
            }
        }).catch(err => console.log('انتظار تهيئة الرابط...'));
    }

    // إرسال وحفظ تفاصيل الحقيبة والمادة التدريبية لشيت جوجل
    function submitMaterialForm() {
        const scriptUrl = localStorage.getItem('scriptUrl');
        if (!scriptUrl) { alert('الرجاء إدخال وحفظ رابط بوابة التعديل أولاً في تبويب الإعدادات!'); return; }
        
        const payload = {
            action: "updateMaterial",
            dayNumber: document.getElementById('matDayNumber').value,
            materialDate: document.getElementById('matDate').value,
            content: document.getElementById('matContent').value.trim(),
            username: localStorage.getItem('savedUsername') || 'مشرف المنظومة'
        };

        fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors', // متوافق مع قيود الأمان لروابط جوجل وإعادة التوجيه
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert('📥 تم إرسال الأمر وتحديث تفاصيل المادة التدريبية بنجاح داخل شيت جوجل!');
            setTimeout(() => { loadMaterialTable(); }, 1500);
        }).catch(err => alert('حدث خطأ أثناء الاتصال بالسيرفر.'));
    }

    // جلب جدول المواد المضافة بالكامل وعرضه بالسفل
    function loadMaterialTable() {
        const scriptUrl = localStorage.getItem('scriptUrl');
        if (!scriptUrl) return;

        fetch(`${scriptUrl}?action=getMaterialList`, { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(list => {
            const tbody = document.querySelector('#materialTable tbody');
            tbody.innerHTML = '';
            
            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">لا توجد مواد مضافة حالياً.</td></tr>`;
                return;
            }
            
            list.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>اليوم ${item.dayNumber}</b></td>
                    <td>${item.materialDate || '—'}</td>
                    <td><div style="max-width:400px; white-space:pre-wrap;">${item.content}</div></td>
                    <td><span class="status-badge status-success">${item.username}</span></td>
                    <td style="font-size:13px; color:var(--text-muted);">${item.time}</td>
                `;
                tbody.appendChild(tr);
            });
        }).catch(() => {
            document.querySelector('#materialTable tbody').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">خطأ أو تأخر في الاستجابة، أعد تحديث الصفحة المحفوظة...</td></tr>`;
        });
    }
</script>
</body>
</html>
