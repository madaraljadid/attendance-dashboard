<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI';
  background:#f1f5f9;
}

header {
  background:#0f172a;
  color:white;
  padding:15px 25px;
  font-size:18px;
  font-weight:bold;
}

.container {
  padding:20px;
}

.cards {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.card {
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.card-title {
  font-size:14px;
  color:#64748b;
}

.card-value {
  font-size:28px;
  font-weight:bold;
  margin-top:5px;
}

.green { color:#10b981; }
.red { color:#ef4444; }
.blue { color:#3b82f6; }

.table-box {
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th {
  background:#f8fafc;
}

</style>
</head>

<body>

<header>📊 داشبورد الحضور والغياب</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <div class="card-title">عدد المتدربين</div>
      <div class="card-value blue" id="total">0</div>
    </div>

    <div class="card">
      <div class="card-title">الحضور</div>
      <div class="card-value green" id="present">0</div>
    </div>

    <div class="card">
      <div class="card-title">الغياب</div>
      <div class="card-value red" id="absent">0</div>
    </div>

    <div class="card">
      <div class="card-title">نسبة الحضور</div>
      <div class="card-value" id="percent">0%</div>
    </div>
  </div>

  <div class="table-box">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

</body>
</html>
